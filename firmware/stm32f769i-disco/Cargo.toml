[package]
name = "geodb-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "geodb on the STM32F769I-DISCO: the cities in flash, queried on the chip"

# Not a member of the geodb-rs workspace: it builds for the microcontroller only.
[workspace]

[dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32f769ni", "memory-x", "unstable-pac", "time-driver-any", "exti", "single-bank"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
geodb-fw-core = { path = "../../crates/geodb-fw-core" }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
opt-level = 3
lto = "fat"
codegen-units = 1
