[package]
name = "geodb-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "geodb on the STM32F769I-DISCO: the cities in flash, queried on the chip, shown on the LCD"

# Not a member of the geodb-rs workspace: it builds for the microcontroller only.
[workspace]

[dependencies]
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
defmt = "1.0"
# disable-blocking-mode: never stall on a full RTT buffer. The DISCO's ST-LINK V2-1 drops the
# SWD link now and then; with the channel in block-if-full mode the firmware would then hang.
defmt-rtt = { version = "1.0", features = ["disable-blocking-mode"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "d5e5b579ad0d61776887738263c2dd0c3c63d564", features = [
  "platform-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "d5e5b579ad0d61776887738263c2dd0c3c63d564", features = [
  "defmt",
  "udp",
  "dhcpv4",
  "medium-ethernet",
] }
# embassy from git: `dsihost` (the MIPI-DSI host of the DISCO's panel) is not on crates.io yet.
# One pinned revision for every embassy crate (the one the plantworks gateway uses).
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "d5e5b579ad0d61776887738263c2dd0c3c63d564", features = [
  "defmt",
  "stm32f769ni",
  "memory-x",
  "unstable-pac",
  "time-driver-any",
  "exti",
  "single-bank",
] }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "d5e5b579ad0d61776887738263c2dd0c3c63d564", features = [
  "defmt",
  "defmt-timestamp-uptime",
  "tick-hz-32_768",
] }
embedded-display-controller = "0.2"
embedded-hal-02 = { package = "embedded-hal", version = "0.2" }
geodb-fw-core = { path = "../../crates/geodb-fw-core" }
otm8009a = "0.1"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
static_cell = "2"
stm32-fmc = "0.4"

[profile.release]
debug = 2
opt-level = 3
lto = "fat"
codegen-units = 1
