[package]
name = "geodb-globe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Interactive wgpu 3D globe demo for geodb-core (WebAssembly)"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "geodb-globe"
required-features = ["native"]

[features]
default = ["webgl"]
# WebGL2 fallback for browsers without WebGPU (pulls in naga's GLSL output
# and glow, most of the wasm). The mini page builds without it.
webgl = ["wgpu/webgl"]
# The mini web demo (mini.html): the compact geoid-only database and packed
# coastlines, fetched at start-up, plus FPS and query benchmarks.
mini = []
# Lets the mini web app also load the full flat database (?data=float):
# pulls in bincode decoding and smart search.
float = ["mini"]
# Native binary on scopekit: the ratatui UI in a terminal (kitty, iTerm2,
# sixel or half blocks) or a window, switchable at runtime; offscreen
# screenshots. scopekit brings wgpu's native backends.
native = ["dep:png", "dep:scopekit"]

[dependencies]
bincode = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
flate2 = { workspace = true }
geodb-core = { path = "../geodb-core", default-features = false, features = ["compact", "json", "search_blobs"] }
glam = { version = "0.30", features = ["bytemuck"] }
js-sys = { workspace = true }
png = { version = "0.18", optional = true }
# Published on crates.io. Locally, a [patch.crates-io] in ../.cargo/config.toml
# (outside this repository) can point it at a sibling ../scopekit checkout.
scopekit = { version = "0.1", optional = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "Blob",
    "CanvasRenderingContext2d",
    "BlobPropertyBag",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomStringMap",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "Headers",
    "HtmlSelectElement",
    "ImageBitmap",
    "ImageData",
    "ImageBitmapOptions",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Performance",
    "PerformanceEntry",
    "PerformanceResourceTiming",
    "Request",
    "ResizeQuality",
    "RequestCache",
    "RequestInit",
    "Response",
    "Url",
    "UrlSearchParams",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
