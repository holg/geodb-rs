[package]
name = "geodb-globe"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Interactive wgpu 3D globe demo for geodb-core (WebAssembly)"
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "geodb-globe"
required-features = ["native"]

[features]
# Native binary on scopekit: the ratatui UI in a terminal (kitty, iTerm2,
# sixel or half blocks) or a window, switchable at runtime; offscreen
# screenshots. scopekit brings wgpu's native backends.
native = ["dep:png", "dep:scopekit"]

[dependencies]
bincode = { workspace = true }
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"
flate2 = { workspace = true }
geodb-core = { path = "../geodb-core", default-features = false, features = ["compact", "search_blobs"] }
glam = { version = "0.30", features = ["bytemuck"] }
js-sys = { workspace = true }
png = { version = "0.18", optional = true }
# Private for now. Locally, a [patch] in ../.cargo/config.toml (outside this
# repository) points it at a sibling ../scopekit checkout; CI needs a deploy
# key (see scopekit's HOWTO section 0).
scopekit = { git = "ssh://git@github.com/holg/scopekit.git", branch = "main", optional = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomStringMap",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "MouseEvent",
    "Performance",
    "PointerEvent",
    "WheelEvent",
    "Window",
] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
