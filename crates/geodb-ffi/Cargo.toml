[package]
name = "geodb-ffi"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "geodb_ffi"
[[bin]]
# Name of the binary you’ll call
name = "uniffi-bindgen"
# This file will live next to Cargo.toml
path = "uniffi-bindgen.rs"

[dependencies]
# UniFFI for cross-language bindings
uniffi = { version = "0.30", features = ["cli"] }

# Core Engine (Force "Turbo" mode: Flat + Gzip + Blobs)
# Note: builder feature disabled for watchOS compatibility (ring crate doesn't support arm64_32)
geodb-core = { path = "../geodb-core", default-features = false, features = ["json", "compact", "search_blobs"] }

# Utilities for manual loading
bincode = { workspace = true }
flate2 = { workspace = true }
once_cell = { workspace = true }
serde = { workspace = true }

[build-dependencies]
#uniffi_build = { version = "0.30", features = [ "build" ] }
uniffi = { version = "0.30", features = ["build"] }
