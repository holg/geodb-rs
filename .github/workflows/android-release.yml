name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deploy_to_play_store:
        description: 'Deploy to Google Play Store?'
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android
          rustup target add i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Rust native libraries
        working-directory: crates/geodb-ffi
        run: |
          cargo ndk --target aarch64-linux-android build --release
          cargo ndk --target armv7-linux-androideabi build --release
          cargo ndk --target x86_64-linux-android build --release
          cargo ndk --target i686-linux-android build --release

      - name: Copy native libraries to Android app
        run: |
          mkdir -p GeoDB-Apps/android-app/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
          cp target/aarch64-linux-android/release/libgeodb_ffi.so GeoDB-Apps/android-app/app/src/main/jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libgeodb_ffi.so GeoDB-Apps/android-app/app/src/main/jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libgeodb_ffi.so GeoDB-Apps/android-app/app/src/main/jniLibs/x86_64/
          cp target/i686-linux-android/release/libgeodb_ffi.so GeoDB-Apps/android-app/app/src/main/jniLibs/x86/

      - name: Decode keystore to app directory
        if: github.ref_type == 'tag'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p GeoDB-Apps/android-app/app
          echo "$KEYSTORE_BASE64" | base64 -d > GeoDB-Apps/android-app/app/release.keystore

      - name: Create .env file
        if: github.ref_type == 'tag'
        working-directory: GeoDB-Apps/android-app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > .env << EOF
          # Android Signing Configuration
          # Generated by GitHub Actions

          # Keystore configuration
          # Path is relative to the app module directory (GeoDB-Apps/android-app/app/)
          KEYSTORE_FILE=release.keystore
          KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD
          KEY_ALIAS=geodb
          KEY_PASSWORD=$KEY_PASSWORD

          # App configuration
          APPLICATION_ID=eu.trahe.geodb
          VERSION_NAME=0.1.5
          VERSION_CODE=7
          EOF

      - name: Grant execute permission for gradlew
        working-directory: GeoDB-Apps/android-app
        run: chmod +x gradlew

      - name: Build signed AAB (Tag builds)
        if: github.ref_type == 'tag'
        working-directory: GeoDB-Apps/android-app
        run: |
          ./gradlew clean
          ./gradlew bundleRelease

      - name: Build unsigned APK (Manual dispatch)
        if: github.ref_type != 'tag'
        working-directory: GeoDB-Apps/android-app
        run: |
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Upload AAB artifact (Tag builds)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: geodb-android-aab
          path: GeoDB-Apps/android-app/app/build/outputs/bundle/release/*.aab

      - name: Upload APKs artifact (Tag builds)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: geodb-android-apks
          path: GeoDB-Apps/android-app/app/build/outputs/apk/release/*.apk

      - name: Upload ProGuard mapping file (Tag builds)
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: geodb-android-mapping
          path: GeoDB-Apps/android-app/app/build/outputs/mapping/release/mapping.txt

      - name: Upload APK artifact (Manual dispatch)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: geodb-android-apk-unsigned
          path: GeoDB-Apps/android-app/app/build/outputs/apk/release/*.apk

  deploy-play-store:
    needs: build-android
    if: |
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_to_play_store == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: geodb-android-aab
          path: release-aab

      - name: Create service account JSON
        env:
          PLAY_STORE_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$PLAY_STORE_SERVICE_ACCOUNT" > service-account.json

      - name: Download mapping file
        uses: actions/download-artifact@v4
        with:
          name: geodb-android-mapping
          path: mapping-file

      - name: Upload to Google Play (Production)
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJson: service-account.json
          packageName: eu.trahe.geodb
          releaseFiles: release-aab/*.aab
          track: production
          status: completed
          whatsNewDirectory: GeoDB-Apps/android-app/release-notes
          mappingFile: mapping-file/mapping.txt

      - name: Clean up
        if: always()
        run: rm -f service-account.json

  attach-to-release:
    needs: build-android
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: geodb-android-aab
          path: android-raw/aab

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: geodb-android-apks
          path: android-raw/apk

      - name: Organize Android artifacts
        run: |
          mkdir -p release-assets/android

          # Move AAB
          if [ -f android-raw/aab/*.aab ]; then
            mv android-raw/aab/*.aab release-assets/android/
          fi

          # Move APKs and rename clearly
          if [ -f android-raw/apk/app-release.apk ]; then
            mv android-raw/apk/app-release.apk release-assets/android/geodb-android-release.apk
          fi

      - name: Create Android README
        run: |
          cat > release-assets/android/README.md << 'EOF'
          # GeoDB Android App

          ## Files

          - `*.aab` - Android App Bundle for Google Play Store
          - `geodb-android-release.apk` - Signed APK for direct installation

          ## Installation

          ### From Google Play Store (Recommended)
          Search for "GeoDB" on Google Play Store or visit:
          https://play.google.com/store/apps/details?id=eu.trahe.geodb

          ### From APK (Sideload)
          1. Download `geodb-android-release.apk`
          2. Enable "Install from Unknown Sources" in Android Settings
          3. Open the APK file to install

          ## Requirements
          - Android 7.0 (API 24) or higher
          - ~50 MB storage space

          ## Features
          - Offline geographic database
          - Search countries, states, and cities
          - Multi-language support (Chinese, English, German, Spanish, French, Italian, Portuguese)
          - Kid-friendly interface

          ## Support
          - Issues: https://github.com/holg/geodb-rs/issues
          - License: MIT
          EOF

      - name: Upload Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/android/*
