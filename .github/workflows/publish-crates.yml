name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify versions match tag
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "Tag version: $TAG_VERSION"

          # Check geodb-core
          CORE_VERSION=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[] | select(.name == "geodb-core") | .version')
          echo "geodb-core version: $CORE_VERSION"

          if [ "$CORE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: geodb-core version ($CORE_VERSION) doesn't match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Publish geodb-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/geodb-core
          # Check if already published (allows retries)
          if cargo search geodb-core --limit 1 | grep -q "$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')"; then
            echo "geodb-core version already published, skipping"
          else
            cargo publish --token $CARGO_REGISTRY_TOKEN
          fi

      - name: Wait for geodb-core to be available
        run: |
          echo "Waiting 30 seconds for crates.io to process geodb-core..."
          sleep 30

      - name: Publish geodb-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/geodb-cli
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "geodb-cli already published or failed"

      - name: Publish geodb-wasm
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cd crates/geodb-wasm
          cargo publish --token $CARGO_REGISTRY_TOKEN || echo "geodb-wasm already published or failed"

      - name: Summary
        run: |
          echo "## Published to crates.io" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ geodb-core" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ geodb-cli" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ geodb-wasm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: geodb-py is published separately to PyPI" >> $GITHUB_STEP_SUMMARY
          echo "Note: geodb-ffi is not published (mobile/FFI only)" >> $GITHUB_STEP_SUMMARY
