name: CI

on:
  push:
    branches: [ main ]
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # =========================
  #  Lint / Test / Docs
  # =========================
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install tooling (cargo-sort, taplo-cli, cargo-deny)
        run: |
          cargo install cargo-sort taplo-cli cargo-deny --locked || true

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo doc
        run: cargo doc --locked --workspace --document-private-items

      - name: cargo-sort
        run: cargo sort -cwg

      - name: taplo format --check
        run: taplo format --check

      - name: cargo-deny
        run: cargo deny check --hide-inclusion-graph --show-stats

      - name: cargo test
        run: cargo test --locked --workspace -- --test-threads=1

  # =========================
  #  Build geodb-cli binaries
  # =========================
  build-cli:
    needs: lint-test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: ""
          - os: macos-14
            target: x86_64-apple-darwin
            use_cross: false
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            use_cross: false
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross (if needed)
        if: matrix.use_cross == true
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Ensure clean build for aarch64
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: cargo clean

      - name: Build geodb-cli
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release -p geodb-cli --target ${{ matrix.target }}
          else
            cargo build --release -p geodb-cli --target ${{ matrix.target }}
          fi

      - name: Upload geodb-cli binary
        uses: actions/upload-artifact@v4
        with:
          name: geodb-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/geodb-cli${{ matrix.ext }}

  # =========================
  #  Build test wheel (cheapest)
  # =========================
  build-test-wheel:
    needs: lint-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # IMPORTANT: no rust-cache here for manylinux builds,
      # to avoid reusing host-built artifacts inside the container.

      - name: Build test wheel (Linux x86_64 only)
        uses: messense/maturin-action@v1
        env:
          # Ensure container uses its own clean target dir
          CARGO_TARGET_DIR: /tmp/maturin-target
        with:
          manylinux: auto
          target: x86_64
          args: --release -m crates/geodb-py/Cargo.toml -o dist

      - name: Upload test wheel
        uses: actions/upload-artifact@v4
        with:
          name: geodb-py-test-wheel
          path: dist/*.whl

