name: Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            ext: ""
          - os: macos-14
            target: x86_64-apple-darwin
            use_cross: false
            ext: ""
          - os: macos-15
            target: aarch64-apple-darwin
            use_cross: false
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build geodb-cli
        shell: bash
        run: |
          cargo build --release -p geodb-cli --target ${{ matrix.target }}

      - name: Upload geodb-cli binary
        uses: actions/upload-artifact@v4
        with:
          name: geodb-cli-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/geodb-cli${{ matrix.ext }}

  attach-binaries-to-release:
    needs: build-cli-binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download all CLI binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries
          pattern: geodb-cli-*
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets/cli
          cd binaries
          for dir in geodb-cli-*; do
            target=${dir#geodb-cli-}
            if [[ -f "$dir/geodb-cli.exe" ]]; then
              # Windows
              cd "$dir"
              zip "../../release-assets/cli/geodb-cli-${target}.zip" geodb-cli.exe
              cd ..
            else
              # Unix
              cd "$dir"
              tar czf "../../release-assets/cli/geodb-cli-${target}.tar.gz" geodb-cli
              cd ..
            fi
          done

      - name: Create CLI README
        run: |
          cat > release-assets/cli/README.md << 'EOF'
          # GeoDB CLI Binaries

          Download the appropriate binary for your platform:

          ## Linux
          - `geodb-cli-x86_64-unknown-linux-gnu.tar.gz` - Linux x86_64

          ## macOS
          - `geodb-cli-x86_64-apple-darwin.tar.gz` - macOS Intel (x86_64)
          - `geodb-cli-aarch64-apple-darwin.tar.gz` - macOS Apple Silicon (ARM64)

          ## Windows
          - `geodb-cli-x86_64-pc-windows-msvc.zip` - Windows x64

          ## Installation

          ### Linux/macOS
          ```bash
          tar xzf geodb-cli-*.tar.gz
          chmod +x geodb-cli
          sudo mv geodb-cli /usr/local/bin/
          ```

          ### Windows
          Extract the ZIP file and add `geodb-cli.exe` to your PATH.

          ## Usage
          ```bash
          geodb-cli --help
          ```
          EOF

      - name: Upload CLI binaries to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/cli/*
