name: Publish geodb_rs to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# =====================================================================
# 1) Build and publish SDIST once (Linux only)
# =====================================================================
jobs:
  publish-sdist:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"

      - name: Build sdist
        run: maturin sdist -m crates/geodb-py/Cargo.toml -o dist

      - name: Upload sdist to PyPI with maturin
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin upload --skip-existing dist/*.tar.gz




  # =====================================================================
  # 2) Build and publish platform wheels (All platforms)
  # =====================================================================
  publish-wheels:
    needs: publish-sdist
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
          # macOS Intel
          - os: macos-14
            target: x86_64
            manylinux: ""
          # macOS Apple Silicon
          - os: macos-15
            target: aarch64
            manylinux: ""
          # Windows
          - os: windows-latest
            target: x64
            manylinux: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # No rust-cache for maturin manylinux builds

      - name: Build & publish wheel
        uses: messense/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          CARGO_TARGET_DIR: /tmp/maturin-target
        with:
          manylinux: ${{ matrix.manylinux }}
          target: ${{ matrix.target }}
          command: publish
          args: >
            --skip-existing
            --no-sdist
            -m crates/geodb-py/Cargo.toml

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geodb-py-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: target/wheels/*.whl

  # =====================================================================
  # 3) Attach wheels to GitHub Release
  # =====================================================================
  attach-wheels-to-release:
    needs: publish-wheels
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: geodb-py-wheel-*
          merge-multiple: true

      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: wheels/*.whl