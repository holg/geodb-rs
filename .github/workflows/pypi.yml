name: Publish geodb_rs to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# =====================================================================
# 1) Build and publish SDIST once (Linux only)
# =====================================================================
jobs:
  publish-sdist:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"

      - name: Build sdist
        run: maturin sdist -m crates/geodb-py/Cargo.toml -o dist

      - name: Upload sdist to PyPI with maturin
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: maturin upload --skip-existing dist/*.tar.gz




  # =====================================================================
  # 2) Build and publish platform wheels (All platforms)
  # =====================================================================
  publish-wheels:
    needs: publish-sdist
    if: github.event_name != 'pull_request'

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (uses manylinux container)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
          # macOS Intel
          - os: macos-14
            target: x86_64-apple-darwin
            manylinux: ""
          # macOS Apple Silicon
          - os: macos-15
            target: aarch64-apple-darwin
            manylinux: ""
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install maturin
        run: pip install "maturin>=1.7,<2.0"

      # Linux: use manylinux container via maturin
      - name: Build wheel (Linux manylinux)
        if: runner.os == 'Linux'
        run: |
          maturin build --release --target ${{ matrix.target }} \
            -m crates/geodb-py/Cargo.toml -o dist \
            --manylinux ${{ matrix.manylinux }}

      # macOS/Windows: direct build
      - name: Build wheel (macOS/Windows)
        if: runner.os != 'Linux'
        run: |
          maturin build --release --target ${{ matrix.target }} -m crates/geodb-py/Cargo.toml -o dist

      - name: Upload wheel to PyPI
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: maturin upload --skip-existing dist/*.whl

      - name: List built wheels for debugging
        shell: bash
        run: |
          echo "=== Searching for built wheels ==="
          find . -name "*.whl" -type f 2>/dev/null || echo "No wheels found"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geodb-py-wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # =====================================================================
  # 3) Attach wheels to GitHub Release
  # =====================================================================
  attach-wheels-to-release:
    needs: publish-wheels
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: wheels-raw
          pattern: geodb-py-wheel-*
          merge-multiple: true

      - name: Organize Python wheels
        run: |
          mkdir -p release-assets/python
          mv wheels-raw/*.whl release-assets/python/ || true

      - name: Create Python README
        run: |
          cat > release-assets/python/README.md << 'EOF'
          # GeoDB Python Wheels

          Pre-built Python wheels for `geodb-rs` package.

          ## Installation from PyPI (Recommended)

          ```bash
          pip install geodb-rs
          ```

          ## Platform Wheels

          If you need to install from these wheels directly:

          ### Linux
          - `geodb_rs-*-manylinux_*_x86_64.whl` - Linux x86_64 (manylinux)

          ### macOS
          - `geodb_rs-*-macosx_*_x86_64.whl` - macOS Intel (x86_64)
          - `geodb_rs-*-macosx_*_arm64.whl` - macOS Apple Silicon (ARM64)

          ### Windows
          - `geodb_rs-*-win_amd64.whl` - Windows x64

          ## Install from wheel

          ```bash
          pip install geodb_rs-*.whl
          ```

          ## Usage

          ```python
          from geodb_rs import GeoDb

          # Load database
          db = GeoDb.load_from_path("path/to/data.json.gz")

          # Search
          results = db.smart_search("Berlin")
          ```

          ## Documentation

          - PyPI: https://pypi.org/project/geodb-rs/
          - GitHub: https://github.com/holg/geodb-rs
          EOF

      - name: Upload Python wheels to GitHub Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/python/*
