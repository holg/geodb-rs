name: Build Universal SPM Package (DISABLED)

# DISABLED: GitHub runners cannot build Apple platform binaries reliably
# Use local build script instead: ./scripts/build_spm_package.sh
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0) - DISABLED, use local build'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-universal-spm:
    name: Build Universal SPM Package
    runs-on: macos-14  # Apple Silicon runner for best performance
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim

      # NOTE: tvOS and watchOS targets temporarily disabled
      # Rust nightly has not had these components available since 2025-11-14
      # See: https://rust-lang.github.io/rustup-components-history
      # Will re-enable when components become available again

      - name: Install additional tools
        run: |
          cargo install uniffi-bindgen || echo "uniffi-bindgen already installed"

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-universal-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-universal-
            ${{ runner.os }}-cargo-

      - name: Verify Xcode installation
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --show-sdk-path

      - name: Build universal SPM package
        run: |
          chmod +x scripts/build_spm_universal.sh
          # Auto-confirm the build
          echo "y" | ./scripts/build_spm_universal.sh

      - name: Fix UniFFI Swift imports
        run: |
          chmod +x scripts/fix_uniffi_imports.sh
          ./scripts/fix_uniffi_imports.sh

      - name: Verify build output
        run: |
          ls -lh "GeoDB-Apps/SPM-GeoDBKit/GeodbFfi.xcframework"
          ls -lh "GeoDB-Apps/SPM-GeoDBKit/GeodbFfi-debug.xcframework"
          ls -lh releases/

      - name: Test SPM package
        run: |
          cd "GeoDB-Apps/SPM-GeoDBKit"
          swift build
          swift test || echo "Tests skipped (may require data files)"

      - name: Calculate checksums
        run: |
          cd releases
          shasum -a 256 *.zip > checksums.txt
          cat checksums.txt

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: GeodbKit ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GeodbKit Universal SPM Package

            Complete Swift Package Manager package for all Apple platforms.

            ### 📦 What's Included

            - ✅ iOS 13.0+ (device + simulator)
            - ✅ macOS 13.0+ (Intel x86_64 + Apple Silicon arm64 universal)
            - ✅ tvOS 13.0+ (device + simulator)
            - ✅ watchOS 6.0+ (device + simulator)
            - ✅ visionOS 1.0+ (device + simulator)

            ### 🎯 Configurations

            - **Release XCFramework** (optimized, smaller)
            - **Debug XCFramework** (full symbols, debugging)
            - **Complete dSYMs** (all platforms)

            ### 📥 Installation

            #### Swift Package Manager

            Add to your `Package.swift`:

            ```swift
            dependencies: [
                .package(url: "https://github.com/${{ github.repository }}.git", from: "${{ steps.version.outputs.VERSION }}")
            ]
            ```

            Or in Xcode:
            1. File → Add Packages
            2. Enter: `https://github.com/${{ github.repository }}.git`
            3. Select version: `${{ steps.version.outputs.VERSION }}`

            ### 📖 Documentation

            See [README](https://github.com/${{ github.repository }}/blob/main/GeoDB-Apps/SPM-GeoDBKit/README.md) for usage examples.

            ### 🔐 Checksums

            See `checksums.txt` for SHA-256 verification.

          files: |
            releases/*.zip
            releases/checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spm-package-${{ steps.version.outputs.VERSION }}
          path: |
            GeoDB-Apps/SPM-GeoDBKit/
            releases/
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Package Contents" >> $GITHUB_STEP_SUMMARY
          echo "- Release XCFramework: \`GeodbFfi.xcframework\`" >> $GITHUB_STEP_SUMMARY
          echo "- Debug XCFramework: \`GeodbFfi-debug.xcframework\`" >> $GITHUB_STEP_SUMMARY
          echo "- Swift bindings: \`Sources/GeodbKit/\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Platforms" >> $GITHUB_STEP_SUMMARY
          echo "✅ iOS | ✅ macOS (Universal) | ✅ tvOS | ✅ watchOS | ✅ visionOS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Release" >> $GITHUB_STEP_SUMMARY
          echo "Version: \`${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -f releases/checksums.txt ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔐 Checksums" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat releases/checksums.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
